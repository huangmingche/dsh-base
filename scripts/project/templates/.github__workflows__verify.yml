name: Product verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: __BASE_PATH__/package.json
      - uses: pnpm/action-setup@v4
      - run: pnpm dsh:init
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --all
      - name: Verify immutable source
        run: |
          test -z "$(git -C "./__BASE_PATH__" status --porcelain --untracked-files=all)"
          test -z "$(git -C "./__BASE_PATH__/.submodules/deepseek-harness" status --porcelain --untracked-files=all)"
