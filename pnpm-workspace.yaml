# One repository-root workspace keeps build discovery inside its ancestor boundary.
# Official sources remain a pinned, read-only submodule, not workspace members.
verifyDepsBeforeRun: false
packages:
  - apps/web
  - packages/build/dsh-base-build-server-dependencies
resolvePeersFromWorkspaceRoot: false
autoInstallPeers: true
strictPeerDependencies: true
storeDir: .pnpm-store
# Reviewed security updates for upstream consumers; preserve their used APIs.
# uuid 11 retains CommonJS v4 support (12+ is ESM-only).
overrides:
  picomatch: npm:@ryotsu/picomatch@4.0.7-a
  "@fortune-sheet/core>uuid": 11.1.1
  "exceljs>uuid": 11.1.1
  "micromark-extension-math>katex": 0.19.1
  "guarded-fetch>undici": 7.30.2
packageExtensions:
  'cf@1.0.0-beta.26':
    dependencies:
      picomatch: npm:@ryotsu/picomatch@4.0.7-a
patchedDependencies:
  '@fortune-sheet/core@1.0.4': .submodules/deepseek-harness/patches/@fortune-sheet__core@1.0.4.patch
  '@fortune-sheet/react@1.0.4': .submodules/deepseek-harness/patches/@fortune-sheet__react@1.0.4.patch
  'exceljs@4.4.0': .submodules/deepseek-harness/patches/exceljs@4.4.0.patch
  'cf@1.0.0-beta.26': patches/cf-picomatch.patch
  '@ryotsu/picomatch@4.0.7-a': patches/picomatch-compat.patch
allowBuilds:
  esbuild: true
  workerd: true
  core-js-pure: false
  "@mongodb-js/zstd": false
  node-liblzma: false
