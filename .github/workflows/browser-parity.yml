name: Browser parity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/browser-parity.yml'
      - 'apps/**'
      - 'packages/client/**'
      - 'packages/boot/**'
      - 'packages/build/**'
      - 'packages/cloudflare-worker/**'
      - 'packages/cloudflare-think/**'
      - 'scripts/**'
      - 'packs/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'dsh-source.lock.json'
      - 'dsh.apps.json'
      - '.submodules/deepseek-harness'
      - 'AGENTS.md'
permissions:
  contents: read
concurrency:
  group: browser-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Explicitly records the compatibility date supported by the locked local workerd.
      DSH_LOCAL_COMPATIBILITY_DATE: '2026-10-30'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm dsh:init
      - run: pnpm --dir apps/web verify:release
      - run: pnpm acceptance:multiapp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-parity-evidence
          path: |
            .artifacts/acceptance/local-ui/
            .artifacts/acceptance/auth-modal-local/
            .artifacts/acceptance/account-launcher/
            .artifacts/browser-compat-report.json
            .artifacts/multiapp-acceptance/
            apps/web/dist/parity-evidence/
          if-no-files-found: ignore
          retention-days: 7
